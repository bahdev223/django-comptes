<div x-show="modalTransfert" x-cloak class="fixed inset-0 z-50 overflow-y-auto" aria-modal="true">
    <div class="flex min-h-full items-center justify-center p-4">
        <button type="button" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm" @click="modalTransfert=false" aria-label="Fermer"></button>
        <div class="relative w-full max-w-lg rounded-2xl bg-white shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
                <div><h2 class="font-semibold text-slate-900">Transférer des fonds</h2><p class="text-xs text-slate-500">Entre deux comptes de la même entreprise</p></div>
                <button type="button" @click="modalTransfert=false" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100"><span class="material-symbols-outlined">close</span></button>
            </div>
            <form method="post" action="{% url 'comptes:transfert_effectuer' %}" class="space-y-4 p-6">
                {% csrf_token %}
                <div><label class="mb-1 block text-sm font-medium text-slate-700">Source</label><select name="source_id" required class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm"><option value="">Sélectionner</option>{% for c in comptes %}<option value="{{ c.id }}">{{ c.nom }} · {{ c.solde_actuel|floatformat:0 }} {{ c.devise_id }}</option>{% endfor %}</select></div>
                <div><label class="mb-1 block text-sm font-medium text-slate-700">Destination</label><select name="dest_id" required class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm"><option value="">Sélectionner</option>{% for c in comptes %}<option value="{{ c.id }}">{{ c.nom }}</option>{% endfor %}</select></div>
                <div><label class="mb-1 block text-sm font-medium text-slate-700">Montant</label><input name="montant" type="number" min="0.01" step="0.01" required class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm"></div>
                <div><label class="mb-1 block text-sm font-medium text-slate-700">Notes</label><textarea name="notes" rows="3" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm" placeholder="Motif du transfert"></textarea></div>
                <div class="flex justify-end gap-3 border-t border-slate-100 pt-4">
                    <button type="button" @click="modalTransfert=false" class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Annuler</button>
                    <button type="submit" class="rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800">Transférer</button>
                </div>
            </form>
        </div>
    </div>
</div>

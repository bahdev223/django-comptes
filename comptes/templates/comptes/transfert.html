{% extends 'comptes/base_comptes.html' %}

{% block compte_content %}
<div class="max-w-xl mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Transfert entre comptes</h1>
        <p class="text-sm text-gray-500">Le transfert reste strictement dans l'entreprise active.</p>
    </div>
    <form method="post" class="bg-white rounded-xl border p-6 space-y-5">
        {% csrf_token %}
        <div><label class="block text-sm font-medium mb-1">Source *</label><select name="source_id" required class="w-full border rounded-lg px-3 py-2"><option value="">Sélectionner</option>{% for c in comptes %}<option value="{{ c.id }}">{{ c.nom }} — {{ c.solde_actuel|floatformat:0 }} {{ c.devise_id }}</option>{% endfor %}</select></div>
        <div><label class="block text-sm font-medium mb-1">Destination *</label><select name="dest_id" required class="w-full border rounded-lg px-3 py-2"><option value="">Sélectionner</option>{% for c in comptes %}<option value="{{ c.id }}">{{ c.nom }}</option>{% endfor %}</select></div>
        <div><label class="block text-sm font-medium mb-1">Montant *</label><input type="number" min="0.01" step="0.01" name="montant" required class="w-full border rounded-lg px-3 py-2"></div>
        <div><label class="block text-sm font-medium mb-1">Notes</label><textarea name="notes" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea></div>
        <div class="flex gap-3"><button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg">Effectuer</button><a href="{% url 'comptes:liste_transferts' %}" class="px-5 py-2 bg-gray-100 rounded-lg">Annuler</a></div>
    </form>
</div>
{% endblock %}

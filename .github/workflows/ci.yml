name: tests

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        database: ["sqlite", "postgres"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_comptes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_comptes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      TEST_DATABASE: ${{ matrix.database }}
      POSTGRES_DB: django_comptes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[api,test]"
      - run: python -m django makemigrations --check --dry-run --settings=tests.settings
      - run: pytest -q

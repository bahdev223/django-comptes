[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-comptes"
version = "0.2.0"
description = "Reusable financial accounts engine for Django ERP — cash, bank, Mobile Money, transfers, reconciliation and closure"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bah Dev", email = "contact@bah-dev.com"},
]
keywords = ["django", "erp", "finance", "accounting", "syscohada", "cash-management", "bank-reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.1",
    "django-appconf>=1.0",
]

[project.optional-dependencies]
api = [
    "djangorestframework>=3.14",
    "django-filter>=23.0",
]
test = [
    "pytest>=8",
    "pytest-django>=4.8",
    "psycopg[binary]>=3.2",
]

[project.urls]
Homepage = "https://github.com/bahdev223/django-comptes"
Repository = "https://github.com/bahdev223/django-comptes.git"
Documentation = "https://github.com/bahdev223/django-comptes#readme"

[tool.setuptools.packages.find]
include = ["comptes*"]

[tool.setuptools.package-data]
comptes = [
    "fixtures/*",
    "assets/providers/ml/*.svg",
    "assets/providers/ml/banks/*.svg",
    "assets/providers/ml/mobile-money/*.svg",
    "templates/comptes/*.html",
    "static/comptes/*.css",
]

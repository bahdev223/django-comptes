[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-comptes"
version = "0.1.0"
description = "Universal financial accounts module for Django ERP — Cash, Bank, Mobile Money, Cards, Transfers, Reconciliation, Daily Closure"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bah Dev", email = "contact@bah-dev.com"},
]
keywords = ["django", "erp", "finance", "accounting", "syscohada", "cash-management", "bank-reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "django-appconf>=1.0",
]

[project.optional-dependencies]
api = [
    "djangorestframework>=3.14",
    "django-filter>=23.0",
]

[project.urls]
Homepage = "https://github.com/bah-dev/django-comptes"
Repository = "https://github.com/bah-dev/django-comptes.git"
Documentation = "https://github.com/bah-dev/django-comptes#readme"

[tool.setuptools.packages.find]
include = ["comptes*"]

[tool.setuptools.package-data]
comptes = ["fixtures/*.csv"]
